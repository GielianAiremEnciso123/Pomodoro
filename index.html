<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Quicksand:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Quicksand', sans-serif;
      text-align: center;
      padding: 30px;
      background: #e8f1e8;
    }

    h1 {
      margin-bottom: 10px;
      font-family: 'Outfit', sans-serif;
      color: #4A3F3A;
    }

    #mode {
      font-size: 20px;
      color: #6B5145;
    }

    #timer {
      font-size: 70px;
      font-weight: bold;
      margin: 20px;
      color: #4A3F3A;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-family: 'Quicksand', sans-serif;
      color: #4A3F3A;
      background: #DCECF8;
    }
  </style>
</head>

<body>
  <h1>Time to Focus!</h1>
  <div id="mode">ᕙ(  •̀ ᗜ •́  )ᕗ</div>
  <div id="timer">25:00</div>

  <button onclick="startTimer()">Start</button>
  <button onclick="pauseTimer()">Pause</button>
  <button onclick="resetTimer()">Reset</button>

  <script>
    let time = 25 * 60;
    let timer = null;
    let isRunning = false;

    function updateDisplay() {
      let minutes = Math.floor(time / 60);
      let seconds = time % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function startTimer() {
      if (isRunning) return;

      isRunning = true;

      timer = setInterval(() => {
        time--;
        updateDisplay();

        if (time <= 0) {
          clearInterval(timer);
          isRunning = false;

          alert("Time's up! Take a break 🫶");

          time = 5 * 60;
          document.getElementById("mode").textContent = "Break";
          updateDisplay();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timer);
      isRunning = false;
    }

    function resetTimer() {
      clearInterval(timer);
      isRunning = false;
      time = 25 * 60;

      document.getElementById("mode").textContent = "ᕙ(  •̀ ᗜ •́  )ᕗ";
      updateDisplay();
    }

    updateDisplay();
  </script>
</body>
</html>
